name: Diagnostic accès Insee

# Diagnostic ponctuel (28 octobre 2026) : le rafraîchissement hebdomadaire échoue parce que le connecteur Insee ne répond pas depuis
# les serveurs GitHub (message d'erreur vide). Ce workflow, lancé à la main, mesure ce qui se passe réellement : adresse du serveur,
# code HTTP, délais, type exact d'exception. À supprimer une fois la cause connue.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Adresse du serveur et accès brut à l'Insee (curl)
        run: |
          echo "Adresse sortante : $(curl -s -m 15 https://api.ipify.org || echo inconnue)"
          for url in \
            "https://bdm.insee.fr/series/sdmx/dataflow" \
            "https://bdm.insee.fr/series/sdmx/data/TAUX-CHOMAGE?startPeriod=2026-01" \
            "https://bdm.insee.fr/series/sdmx/data/SERIES_BDM/010605333?startPeriod=2024-01"; do
            echo "--- $url"
            curl -s -o /dev/null -m 60 -w "HTTP %{http_code} ; connexion %{time_connect}s ; premier octet %{time_starttransfer}s ; total %{time_total}s ; octets %{size_download}\n" "$url" \
              || echo "curl a échoué (code $?)"
          done

      - name: Accès par httpx, comme le connecteur (type exact d'exception)
        working-directory: backend
        run: |
          pip install -q httpx==0.27.2
          python - <<'EOF'
          import asyncio, time
          import httpx

          URLS = [
              ("liste des jeux (15 s, comme insee.py)", "https://bdm.insee.fr/series/sdmx/dataflow", 15.0),
              ("taux de chômage départemental (30 s, comme insee_departments.py)", "https://bdm.insee.fr/series/sdmx/data/TAUX-CHOMAGE?startPeriod=2026-01", 30.0),
              ("même requête, délai long (120 s)", "https://bdm.insee.fr/series/sdmx/data/TAUX-CHOMAGE?startPeriod=2026-01", 120.0),
          ]

          async def un(nom, url, delai):
              debut = time.time()
              try:
                  async with httpx.AsyncClient(timeout=delai) as c:
                      r = await c.get(url)
                  print(f"[OK ] {nom} : HTTP {r.status_code}, {len(r.content)} octets, {time.time() - debut:.1f} s")
              except Exception as exc:
                  print(f"[ERR] {nom} : {type(exc).__name__} après {time.time() - debut:.1f} s ; str = {str(exc)!r} ; repr = {exc!r}")

          async def main():
              for nom, url, delai in URLS:
                  await un(nom, url, delai)

          asyncio.run(main())
          EOF
