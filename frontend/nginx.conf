server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Routes cote client (React Router) : toute route inconnue retombe sur
    # index.html, sinon un rechargement sur /tester-h1 renverrait un 404 nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le service "backend" du docker-compose -- ne sert que si
    # frontend et backend sont deployes ensemble derriere ce meme nginx (auquel
    # cas VITE_API_BASE_URL reste vide au build et l'app appelle "/api" en relatif).
    # Si frontend et backend sont deployes separement, ce bloc n'est jamais
    # atteint : VITE_API_BASE_URL pointe alors directement vers le backend.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
